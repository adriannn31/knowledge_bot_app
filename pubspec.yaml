name: knowledge_bot_app
description: A Flutter app for an internal AI knowledge bot
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Networking
  http: ^1.2.0
  flutter_dotenv: ^6.0.0
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.1
  
  # File Handling
  file_picker: ^8.0.0
  path: ^1.9.0
  read_pdf_text: ^0.3.1       # To read PDFs

  # New Features (Brain, Memory, Ears)
  shared_preferences: ^2.2.2  # To save chat history
  speech_to_text: ^6.6.1      # For the Microphone
  permission_handler: ^11.3.0 # To ask permission to use the Mic
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# -----------------------------------------------------------
#  Keep this section EXACTLY like this (2 spaces indentation)
# -----------------------------------------------------------
flutter:
  uses-material-design: true
  
 

  